<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>안내챗봇 프로토타입 — 모바일</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: center; gap: 32px; padding: 32px 16px; background: #EBEFF5; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; color: #333; box-sizing: border-box; }
  .phone { width: 390px; height: 844px; border: 12px solid #1F2024; border-radius: 44px; overflow: hidden; background: #fff; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .phone iframe { width: 100%; height: 100%; border: 0; display: block; }
  .side { max-width: 320px; font-size: 14px; line-height: 1.7; }
  .side h1 { font-size: 20px; margin: 0 0 8px; }
  .side a { color: #7F1A21; }
</style>
</head>
<body>
  <div class="phone"><iframe src="index.html" title="모바일 화면(390×844)"></iframe></div>
  <div class="side">
    <h1>모바일 미리보기 (390×844)</h1>
    <p>화면 폭 767px 이하에서는 패널이 <b>전체 화면</b>이 되고, 런처는 원형, 확대 버튼은 없다(화면정의 "반응형").</p>
    <p>시연 컨트롤은 화면 안 왼쪽 위 <b>⚙ 펴기</b>로 연다.</p>
    <p>전화 카드는 모바일에서 <code>tel:</code> 버튼이 된다.</p>
    <p><a href="index.html">PC 화면으로</a></p>
  </div>
</body>
</html>
